<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CareerQuestAI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        CareerQuestAI
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#jobs">Find Jobs</a>
        <a href="login.html">Login</a>
    </div>

</nav>


<main class="auth-page">

    <div class="auth-card register-card">

        <div class="auth-header">
            <h1>Create your account</h1>

            <p>
                Start your career journey with CareerQuestAI.
            </p>
        </div>


        <!-- Account Type -->

        <div class="role-selection">

            <p class="role-title">
                I am registering as
            </p>

            <div class="role-options">

                <button
                    type="button"
                    class="role-option active"
                    data-role="JOB_SEEKER">

                    <span class="role-icon">💼</span>

                    <span>
                        <strong>Job Seeker</strong>
                        <small>Find jobs & manage applications</small>
                    </span>

                </button>


                <button
                    type="button"
                    class="role-option"
                    data-role="EMPLOYER"">

                    <span class="role-icon">🏢</span>

                    <span>
                        <strong>Employer</strong>
                        <small>Post jobs & find candidates</small>
                    </span>

                </button>

            </div>

        </div>


        <!-- Registration Form -->

        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="auth-button">

                Create Account

            </button>


            <p
                id="registerMessage"
                class="auth-message">
            </p>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<footer class="footer">

    <p>
        © 2026 CareerQuestAI. All rights reserved.
    </p>

</footer>


<script src="js/register.js"></script>

</body>
</html>
