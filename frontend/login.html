<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerQuestAI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="navbar-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">CQ</span>
                <span class="logo-text">CareerQuestAI</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html" class="nav-button">Get Started</a>
            </nav>

        </div>
    </header>


    <!-- Login Section -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    CQ
                </div>

                <h1>Welcome back</h1>

                <p>
                    Login to continue your career journey.
                </p>

            </div>


            <form id="loginForm" class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="auth-button">
                    Login
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 CareerQuestAI. All rights reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>
</html>
